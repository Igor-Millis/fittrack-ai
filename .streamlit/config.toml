[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f6f6f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
port = 8501
address = "localhost"
runOnSave = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
